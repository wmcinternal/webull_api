<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Client Trading Portal</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #ffffff; padding: 30px; }
        .form-group { margin-bottom: 15px; max-width: 350px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #38bdf8; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #141414; border: 1px solid #1e293b; color: #fff; border-radius: 4px; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        #responseContainer { margin-top: 20px; padding: 20px; border: 1px solid #1e293b; background: #141414; border-radius: 8px; max-width: 600px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #0a0a0a; border: 1px solid #334155; padding: 12px; border-radius: 6px; }
        .card-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .card-value { font-size: 18px; font-weight: bold; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        th { color: #94a3b8; font-weight: 600; }
        td { color: #f8fafc; }
    </style>


</head>


<body>

    <h2>Client Trading Portal</h2>

    <div class="form-group">
        <label>Account ID</label>
        <input type="text" id="account_id" value="C8193691">
    </div>

    <div class="form-group">
        <label>ETF Name</label>
        <input type="text" id="symbol" value="SCHX">
    </div>

    <div class="form-group">
        <label>Amount ($ USD)</label>
        <input type="number" step="0.01" id="amount" value="100" >
    </div>

    <div class="form-group">
        <label>Monthly Execution Day</label>
        <input type="text" id="day_of_month" value="5"></input>
    </div>


    <button type="button" onclick="submitDcaOrder()">Schedule Cron Job</button>
    <button type="button" id="simToggleBtn" onclick="toggleSimulation()" style="background: #10b981; margin-left: 10px;">▶️ Start Simulation (Every 10s)</button>

    <div id="responseContainer" style="display: none;">
        <h3>Order Result</h3>
        <div id="resultContent"></div>
    </div>


</body>



<script>



    async function submitDcaOrder() {
            const container = document.getElementById("responseContainer");
            const resultContent = document.getElementById("resultContent");
            
            container.style.display = "block";
            resultContent.innerHTML = "Submitting order to Webull Sandbox...";

            const payload = {
                account_id: document.getElementById("account_id").value,
                symbol: document.getElementById("symbol").value,
                amount: parseFloat(document.getElementById("amount").value),
                day_of_month: parseInt(document.getElementById("day_of_month").value)
            };

            try {
                const response = await fetch("/schedule-order", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                resultContent.innerHTML = `
                    <div class="card">
                        <div class="card-label">Schedule Status</div>
                        <div class="card-value" style="color: #10b981;">${data.status}</div>
                        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 0;">
                            Recurring order scheduled for <strong>${data.execution_day}</strong>.
                        </p>
                    </div>
                `;
            } catch (error) {
                resultContent.innerHTML = "<p style='color: #ef4444;'>Error submitting order: " + error + "</p>";
            }
        }

    async function executeOneCycle() {
    const container = document.getElementById("responseContainer");
    const resultContent = document.getElementById("resultContent");
    
    container.style.display = "block";
    resultContent.innerHTML = "Executing order...";

    const payload = {
        account_id: document.getElementById("account_id").value,
        symbol: document.getElementById("symbol").value,
        amount: parseFloat(document.getElementById("amount").value)
    };

    try {
        const response = await fetch("/execute-now", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();

        if (data.status === "FAILED") {
                resultContent.innerHTML = `<p style="color: #ef4444; font-weight: bold;">❌ ${data.reason}</p>`;
                return;
            }

        let portfolioRows = "";
        for (const [ticker, pos] of Object.entries(data.portfolio)) {
            portfolioRows += `
                <tr>
                    <td><strong>${ticker}</strong></td>
                    <td>${pos.total_shares}</td>
                    <td>$${pos.total_invested.toFixed(2)}</td>
                </tr>`;
        }

        resultContent.innerHTML = `
                <div class="summary-grid">
                    <div class="card">
                        <div class="card-label">Last Order Executed</div>
                        <div class="card-value">${data.symbol}</div>
                        <div style="font-size: 12px; color: #10b981; margin-top: 4px;">
                            +${data.shares_bought} shares @ $${data.buy_price.toFixed(2)}
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-label">Remaining Cash Balance</div>
                        <div class="card-value" style="color: #10b981;">$${data.remaining_cash.toFixed(2)}</div>
                    </div>
                </div>

                <h4 style="margin-bottom: 8px; color: #38bdf8;">Current Stock Portfolio</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Total Shares Owned</th>
                            <th>Total Amount Invested</th>
                        </tr>
                    </thead>
                    <tbody>${portfolioRows}</tbody>
                </table>
            `;
        



        
    } catch (error) {
        resultContent.innerHTML = "<p style='color: #ef4444;'>Execution Error: " + error + "</p>";
    }
    }


    let autoRunInterval=null;
    function toggleSimulation(){

        const btn=document.getElementById("simToggleBtn");

        if (autoRunInterval === null) {
            
            executeOneCycle();
            autoRunInterval = setInterval(executeOneCycle, 10000);
            
            btn.innerHTML = "⏹️ Stop Simulation";
            btn.style.background = "#ef4444"; // Red color
        } else {
            
            stopSimulation();
        }
    }

    function stopSimulation() {

        const btn=document.getElementById("simToggleBtn");

        if (autoRunInterval!==null) {
            clearInterval(autoRunInterval);
            autoRunInterval=null;
            btn.innerHTML="▶️ Start Simulation (Every 10s)";
            btn.style.background="#10b981";
        }

    }



</script>

</html>
