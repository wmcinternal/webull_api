<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Client Trading Portal</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #ffffff; padding: 30px; }
        .form-group { margin-bottom: 15px; max-width: 350px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #38bdf8; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #141414; border: 1px solid #1e293b; color: #fff; border-radius: 4px; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        #responseContainer { margin-top: 20px; padding: 15px; border: 1px solid #38bdf8; background: #141414; border-radius: 6px; max-width: 500px; }
        pre { background: #000; padding: 10px; color: #38bdf8; overflow-x: auto; font-size: 12px; }
    </style>


</head>


<body>

    <h2>Client Trading Portal</h2>

    <div class="form-group">
        <label>Account ID</label>
        <input type="text" id="account_id" >
    </div>

    <div class="form-group">
        <label>ETF Name</label>
        <input type="text" id="symbol" >
    </div>

    <div class="form-group">
        <label>Amount ($ USD)</label>
        <input type="number" step="0.01" id="amount" >
    </div>

    <div class="form-group">
        <label>Frequency</label>
        <select id="frequency">
            <option value="DAILY" selected>Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
        </select>
    </div>

    <div class="form-group">
        <label>Purchase Date & Time</label>
        <input type="datetime-local" id="schedule_time">
    </div>

    <button type="button" onclick="submitDcaOrder()">Submit DCA Order</button>

    <div id="responseContainer" style="display: none;">
        <h3>Order Result</h3>
        <div id="resultContent"></div>
    </div>


</body>



<script>

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(9, 30, 0, 0);
    document.getElementById('schedule_time').value = tomorrow.toISOString().slice(0, 16);

    async function submitDcaOrder() {
            const container = document.getElementById("responseContainer");
            const resultContent = document.getElementById("resultContent");
            
            container.style.display = "block";
            resultContent.innerHTML = "Submitting order to Webull Sandbox...";

            const payload = {
                account_id: document.getElementById("account_id").value,
                symbol: document.getElementById("symbol").value,
                amount: parseFloat(document.getElementById("amount").value),
                frequency: document.getElementById("frequency").value,
                schedule_time: document.getElementById("schedule_time").value
            };

            try {
                const response = await fetch("/schedule-order", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                resultContent.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
            } catch (error) {
                resultContent.innerHTML = "<p style='color: #ef4444;'>Error submitting order: " + error + "</p>";
            }
        }


</script>

</html>
